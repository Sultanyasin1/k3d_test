name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 1. Enskilda variabler (refereras aldrig till varandra här)
  IMAGE_OWNER: ${{ github.repository_owner }}  # Ersätts automatiskt med ditt användarnamn
  IMAGE_NAME: my-nextjs-app
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 2. Rättigheter för att pusha till GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test || echo "No tests found, skipping..."

      - name: Build Next.js
        run: npm run build

      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 3. Bygg och tagga – konstruera sökvägen inline
      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest

      # 4. Sårbarhetsskanning (valfritt)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL"

      # 5. Logga in på GHCR – ersätter Docker Hub
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 6. Pusha till GHCR – konstruera sökvägen inline
      - name: Push Docker image to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest

      # 7. Uppdatera GitOps-repot – kopiera deployment.yaml med rätt image
      - name: Update GitOps repo
        run: |
          git clone https://${{ secrets.GITOPS_REPO_PAT }}@github.com/${{ secrets.GITOPS_REPO_PATH }}.git argocddeploytest
          cp deployment.yaml argocddeploytest/manifests/deployment.yaml
          cd argocddeploytest
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add manifests/deployment.yaml
          git commit -m "Update image tag to ${{ env.SHORT_SHA }}" || echo "No changes to commit"
          git push origin master